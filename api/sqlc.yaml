version: "2"
sql:
  - engine: "postgresql"
    queries: "queries"
    schema: "../supabase/migrations"
    gen:
      go:
        package: "dbgen"
        out: "gen/dbgen"
        sql_package: "pgx/v5"
        emit_interface: true
        overrides:
          - db_type: "uuid"
            go_type: "string"
          - db_type: "uuid"
            nullable: true
            go_type:
              type: "string"
              pointer: true
