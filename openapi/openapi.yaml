openapi: 3.0.3
info:
  title: daily-wlog API
  description: >
    Contract source of truth for the daily-wlog API. Go server stubs
    (oapi-codegen) and the app's TypeScript client types (openapi-typescript)
    are both generated from this file; regenerate whenever it changes.
  version: 0.1.0
paths:
  /healthz:
    get:
      operationId: getHealth
      summary: Liveness and database health
      responses:
        "200":
          description: API and database are healthy.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
        "503":
          description: The database is unreachable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /me:
    post:
      operationId: provisionMe
      summary: Provision and return the signed-in User's world
      description: >
        Idempotent. On first sign-in it atomically creates the User, their
        Journal, and the five seeded categories; on every later call it
        returns the same world unchanged.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: The signed-in User's provisioned world.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
        "401":
          description: Missing or invalid access token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Provisioning failed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /entries:
    post:
      operationId: createEntry
      summary: Create an Entry
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateEntry"
      responses:
        "201":
          description: The created Entry, with its assigned position.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Entry"
        "400":
          description: Invalid date, unknown category, or missing content.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Missing or invalid access token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Creating the Entry failed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    get:
      operationId: listEntries
      summary: List a date's Entries in order
      security:
        - bearerAuth: []
      parameters:
        - name: date
          in: query
          required: true
          schema:
            type: string
          description: The Entry date, YYYY-MM-DD.
      responses:
        "200":
          description: The date's Entries, ordered by position.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EntryList"
        "400":
          description: Invalid date.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Missing or invalid access token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Listing Entries failed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /entries/{id}:
    patch:
      operationId: updateEntry
      summary: Update an Entry
      description: >
        Full replacement of the editable fields: the client always sends the
        category and the whole content blob (it owns both).
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateEntry"
      responses:
        "200":
          description: The updated Entry.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Entry"
        "400":
          description: Unknown category or missing content.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Missing or invalid access token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: No such Entry in the signed-in User's Journal.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Updating the Entry failed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      operationId: deleteEntry
      summary: Delete an Entry
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Deleted.
        "401":
          description: Missing or invalid access token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: No such Entry in the signed-in User's Journal.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Deleting the Entry failed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /days/{date}/order:
    put:
      operationId: reorderDay
      summary: Reorder a date's Entries
      description: >
        Replaces the date's entry order. entryIds must be exactly the date's
        Entries — every id, once. Positions become 1..n in the given order.
      security:
        - bearerAuth: []
      parameters:
        - name: date
          in: path
          required: true
          schema:
            type: string
          description: The Entry date, YYYY-MM-DD.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReorderDay"
      responses:
        "200":
          description: The date's Entries in their new order.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EntryList"
        "400":
          description: Invalid date, or entryIds is not exactly the date's Entries.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Missing or invalid access token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Reordering failed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /categories:
    post:
      operationId: createCategory
      summary: Create a Category or Subcategory
      description: >
        Creates a category for the signed-in User with the auto-assigned
        'tag' icon (editable later in category management). With parentId it
        creates a Subcategory of that top-level Category; two levels is the
        maximum. Names are unique per (User, parent).
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCategory"
      responses:
        "201":
          description: The created Category, positioned after its siblings.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Category"
        "400":
          description: Invalid name, color, or parent.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Missing or invalid access token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: A sibling with this name already exists.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Creating the category failed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /entries/{id}/photos/presign:
    post:
      operationId: presignPhotos
      summary: Presign direct-to-storage uploads for an Entry's photos
      description: >
        Returns storage upload URLs for count photos (full image + thumbnail
        each). Photo bytes never transit the API (ADR-0002); paths are
        namespaced per user and Entry, and the 10-photo cap counts existing
        photos.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PresignPhotos"
      responses:
        "200":
          description: One upload pair per requested photo.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PhotoUploads"
        "400":
          description: Invalid count or the 10-photo cap would be exceeded.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Missing or invalid access token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: No such Entry in the signed-in User's Journal.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Presigning failed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /entries/{id}/photos:
    post:
      operationId: registerPhotos
      summary: Record uploaded photos on an Entry
      description: >
        Called after the client has uploaded to the presigned URLs. Paths
        must belong to this Entry's namespace; positions append in the given
        order; the 10-photo cap is enforced.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterPhotos"
      responses:
        "201":
          description: The Entry's full photo list, in position order.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PhotoList"
        "400":
          description: Foreign paths, duplicates, or the cap exceeded.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Missing or invalid access token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: No such Entry in the signed-in User's Journal.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Recording the photos failed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /entries/{id}/photos/order:
    put:
      operationId: reorderPhotos
      summary: Reorder an Entry's photos
      description: >
        photoIds must be exactly the Entry's photos — every id, once.
        Positions become 1..n in the given order.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReorderPhotos"
      responses:
        "200":
          description: The Entry's photos in their new order.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PhotoList"
        "400":
          description: photoIds is not exactly the Entry's photos.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Missing or invalid access token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: No such Entry in the signed-in User's Journal.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Reordering failed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /photos/{id}:
    delete:
      operationId: deletePhoto
      summary: Delete a photo
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Deleted (row and storage objects).
        "401":
          description: Missing or invalid access token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: No such photo on the signed-in User's Entries.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Deleting the photo failed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /months/{month}:
    get:
      operationId: getMonth
      summary: A month's dot structure in one call
      description: >
        Days that have Entries, each with its category ids in entry order —
        everything the month grid needs to draw dots. Titles stay out: the
        selected-day panel fetches its day through /entries.
      security:
        - bearerAuth: []
      parameters:
        - name: month
          in: path
          required: true
          schema:
            type: string
          description: The month, YYYY-MM.
      responses:
        "200":
          description: The month's days that have Entries, in date order.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MonthDots"
        "400":
          description: Invalid month.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Missing or invalid access token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Loading the month failed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Supabase Auth access token, verified against the project JWKS.
  schemas:
    Me:
      type: object
      required:
        - userId
        - journalId
        - categories
      properties:
        userId:
          type: string
        journalId:
          type: string
        categories:
          type: array
          items:
            $ref: "#/components/schemas/Category"
    Category:
      type: object
      required:
        - id
        - name
        - color
        - icon
        - position
      properties:
        id:
          type: string
        name:
          type: string
        color:
          type: string
          description: Hex color; presets map to the category palette.
        icon:
          type: string
        parentId:
          type: string
        position:
          type: integer
    CreateEntry:
      type: object
      required:
        - date
        - categoryId
        - content
      properties:
        date:
          type: string
          description: The Entry date, YYYY-MM-DD.
        categoryId:
          type: string
          description: A top-level Category owned by the signed-in User.
        content:
          type: string
          description: >
            Opaque versioned blob holding the Entry's title and note. The
            server stores and returns it verbatim and never parses it
            (ADR-0004); the title requirement is enforced by the client.
            Capped at 64 KiB.
        subcategoryId:
          type: string
          description: Optional refinement; must be a child of categoryId.
    UpdateEntry:
      type: object
      required:
        - categoryId
        - content
      properties:
        categoryId:
          type: string
          description: A top-level Category owned by the signed-in User.
        subcategoryId:
          type: string
          description: Optional refinement; must be a child of categoryId.
        content:
          type: string
          description: The full replacement content blob (opaque, ADR-0004).
    ReorderDay:
      type: object
      required:
        - entryIds
      properties:
        entryIds:
          type: array
          items:
            type: string
          description: Every Entry id of the date, once, in the new order.
    CreateCategory:
      type: object
      required:
        - name
        - color
      properties:
        name:
          type: string
        color:
          type: string
          description: >
            Hex color. Presets come from the category palette; custom values
            are free per the ratified color decision. Subcategories store
            their parent's color but always render through the parent.
        parentId:
          type: string
          description: When present, creates a Subcategory of this Category.
    Entry:
      type: object
      required:
        - id
        - date
        - position
        - categoryId
        - authorId
        - content
      properties:
        id:
          type: string
        date:
          type: string
        position:
          type: integer
        categoryId:
          type: string
        subcategoryId:
          type: string
        authorId:
          type: string
        content:
          type: string
        photos:
          type: array
          items:
            $ref: "#/components/schemas/Photo"
    EntryList:
      type: object
      required:
        - entries
      properties:
        entries:
          type: array
          items:
            $ref: "#/components/schemas/Entry"
    PresignPhotos:
      type: object
      required:
        - count
      properties:
        count:
          type: integer
          description: How many photos will be uploaded (1..remaining cap).
    PhotoUpload:
      type: object
      required:
        - objectPath
        - thumbPath
        - uploadUrl
        - thumbUploadUrl
      properties:
        objectPath:
          type: string
        thumbPath:
          type: string
        uploadUrl:
          type: string
        thumbUploadUrl:
          type: string
    PhotoUploads:
      type: object
      required:
        - uploads
      properties:
        uploads:
          type: array
          items:
            $ref: "#/components/schemas/PhotoUpload"
    RegisterPhoto:
      type: object
      required:
        - objectPath
        - thumbPath
      properties:
        objectPath:
          type: string
        thumbPath:
          type: string
        takenAt:
          type: string
          description: RFC3339 capture time kept from the original (GPS is stripped client-side).
    RegisterPhotos:
      type: object
      required:
        - photos
      properties:
        photos:
          type: array
          items:
            $ref: "#/components/schemas/RegisterPhoto"
    ReorderPhotos:
      type: object
      required:
        - photoIds
      properties:
        photoIds:
          type: array
          items:
            type: string
          description: Every photo id of the Entry, once, in the new order.
    Photo:
      type: object
      required:
        - id
        - position
        - url
        - thumbUrl
      properties:
        id:
          type: string
        position:
          type: integer
        url:
          type: string
          description: Short-lived signed download URL.
        thumbUrl:
          type: string
        takenAt:
          type: string
    PhotoList:
      type: object
      required:
        - photos
      properties:
        photos:
          type: array
          items:
            $ref: "#/components/schemas/Photo"
    MonthDay:
      type: object
      required:
        - date
        - categoryIds
      properties:
        date:
          type: string
        categoryIds:
          type: array
          description: The day's Entry categories, in entry order.
          items:
            type: string
    MonthDots:
      type: object
      required:
        - days
      properties:
        days:
          type: array
          items:
            $ref: "#/components/schemas/MonthDay"
    Health:
      type: object
      required:
        - status
        - schemaVersion
      properties:
        status:
          type: string
          enum:
            - ok
        schemaVersion:
          type: integer
          description: Version read from the app_info migration baseline.
    Error:
      type: object
      required:
        - message
      properties:
        message:
          type: string
