openapi: 3.0.3
info:
  title: daily-wlog API
  description: >
    Contract source of truth for the daily-wlog API. Go server stubs
    (oapi-codegen) and the app's TypeScript client types (openapi-typescript)
    are both generated from this file; regenerate whenever it changes.
  version: 0.1.0
paths:
  /healthz:
    get:
      operationId: getHealth
      summary: Liveness and database health
      responses:
        "200":
          description: API and database are healthy.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
        "503":
          description: The database is unreachable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /me:
    post:
      operationId: provisionMe
      summary: Provision and return the signed-in User's world
      description: >
        Idempotent. On first sign-in it atomically creates the User, their
        Journal, and the five seeded categories; on every later call it
        returns the same world unchanged.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: The signed-in User's provisioned world.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
        "401":
          description: Missing or invalid access token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Provisioning failed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /entries:
    post:
      operationId: createEntry
      summary: Create an Entry
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateEntry"
      responses:
        "201":
          description: The created Entry, with its assigned position.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Entry"
        "400":
          description: Invalid date, unknown category, or missing content.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Missing or invalid access token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Creating the Entry failed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    get:
      operationId: listEntries
      summary: List a date's Entries in order
      security:
        - bearerAuth: []
      parameters:
        - name: date
          in: query
          required: true
          schema:
            type: string
          description: The Entry date, YYYY-MM-DD.
      responses:
        "200":
          description: The date's Entries, ordered by position.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EntryList"
        "400":
          description: Invalid date.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Missing or invalid access token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Listing Entries failed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Supabase Auth access token, verified against the project JWKS.
  schemas:
    Me:
      type: object
      required:
        - userId
        - journalId
        - categories
      properties:
        userId:
          type: string
        journalId:
          type: string
        categories:
          type: array
          items:
            $ref: "#/components/schemas/Category"
    Category:
      type: object
      required:
        - id
        - name
        - color
        - icon
        - position
      properties:
        id:
          type: string
        name:
          type: string
        color:
          type: string
          description: Hex color; presets map to the category palette.
        icon:
          type: string
        parentId:
          type: string
        position:
          type: integer
    CreateEntry:
      type: object
      required:
        - date
        - categoryId
        - content
      properties:
        date:
          type: string
          description: The Entry date, YYYY-MM-DD.
        categoryId:
          type: string
          description: A top-level Category owned by the signed-in User.
        content:
          type: string
          description: >
            Opaque versioned blob holding the Entry's title and note. The
            server stores and returns it verbatim and never parses it
            (ADR-0004); the title requirement is enforced by the client.
            Capped at 64 KiB.
    Entry:
      type: object
      required:
        - id
        - date
        - position
        - categoryId
        - authorId
        - content
      properties:
        id:
          type: string
        date:
          type: string
        position:
          type: integer
        categoryId:
          type: string
        authorId:
          type: string
        content:
          type: string
    EntryList:
      type: object
      required:
        - entries
      properties:
        entries:
          type: array
          items:
            $ref: "#/components/schemas/Entry"
    Health:
      type: object
      required:
        - status
        - schemaVersion
      properties:
        status:
          type: string
          enum:
            - ok
        schemaVersion:
          type: integer
          description: Version read from the app_info migration baseline.
    Error:
      type: object
      required:
        - message
      properties:
        message:
          type: string
